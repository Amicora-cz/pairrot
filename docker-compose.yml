# Local development database (appsettings.Development.json points at localhost:5433).
# Production runs its own container from deploy/docker-compose.yml; integration tests start
# throwaway databases with Testcontainers.
name: pairrot

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pairrot}
      POSTGRES_USER: ${POSTGRES_USER:-pairrot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pairrot}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - pairrot-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pairrot-db:
